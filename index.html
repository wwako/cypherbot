<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAKO CYPHER MINI</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #161616;
            color: #c0c0c0;
            font-family: 'Courier New', Courier, monospace;
            padding: 15px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { color: #888888; font-size: 20px; margin-bottom: 10px; }
        label { align-self: flex-start; font-size: 12px; color: #777777; font-weight: bold; margin-top: 10px; }
        textarea, input {
            width: 100%;
            background-color: #242424;
            color: #c0c0c0;
            border: none;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            border-radius: 4px;
            box-sizing: border-box;
            margin-top: 5px;
            resize: none;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-top: 15px;
        }
        button {
            flex: 1;
            background-color: #333333;
            color: #c0c0c0;
            border: none;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:active { background-color: #4a4a4a; color: #ffffff; }
    </style>
</head>
<body>

    <h2>CYPHER MINI</h2>

    <label>ТЕКСТ:</label>
    <textarea id="inputText" rows="3" placeholder="Введи текст..."></textarea>

    <label>КЛЮЧ:</label>
    <input type="number" id="keyInput" value="7">

    <div class="btn-group">
        <button onclick="handleEncrypt()">ШИФРОВАТЬ</button>
        <button onclick="handleDecrypt()">РАСШИФРОВАТЬ</button>
    </div>

    <label>РЕЗУЛЬТАТ:</label>
    <textarea id="outputText" rows="3" readonly></textarea>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем приложение на весь экран

        const RU_UPPER = "АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ";
        const RU_LOWER = "абвгдеёжзийклмнопрстуфхцчшщъыьэюя";
        const EN_UPPER = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const EN_LOWER = "abcdefghijklmnopqrstuvwxyz";
        const DIGITS = "0123456789";

        function processText(text, key, mode = 'encrypt') {
            let result = "";
            if (mode === 'decrypt') {
                text = text.split("").reverse().join("");
            }

            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                let shift = i + key;
                if (mode === 'decrypt') shift = -shift;

                if (RU_UPPER.includes(char)) {
                    let idx = (RU_UPPER.indexOf(char) + shift) % 33;
                    result += RU_UPPER[(idx < 0 ? idx + 33 : idx)];
                } else if (RU_LOWER.includes(char)) {
                    let idx = (RU_LOWER.indexOf(char) + shift) % 33;
                    result += RU_LOWER[(idx < 0 ? idx + 33 : idx)];
                } else if (EN_UPPER.includes(char)) {
                    let idx = (EN_UPPER.indexOf(char) + shift) % 26;
                    result += EN_UPPER[(idx < 0 ? idx + 26 : idx)];
                } else if (EN_LOWER.includes(char)) {
                    let idx = (EN_LOWER.indexOf(char) + shift) % 26;
                    result += EN_LOWER[(idx < 0 ? idx + 26 : idx)];
                } else if (DIGITS.includes(char)) {
                    let idx = (DIGITS.indexOf(char) + shift) % 10;
                    result += DIGITS[(idx < 0 ? idx + 10 : idx)];
                } else {
                    result += char;
                }
            }
if (mode === 'encrypt') {
                result = result.split("").reverse().join("");
            }
            return result;
        }

        function handleEncrypt() {
            let text = document.getElementById('inputText').value;
            let key = parseInt(document.getElementById('keyInput').value) || 0;
            document.getElementById('outputText').value = processText(text, key, 'encrypt');
        }

        function handleDecrypt() {
            let text = document.getElementById('inputText').value;
            let key = parseInt(document.getElementById('keyInput').value) || 0;
            document.getElementById('outputText').value = processText(text, key, 'decrypt');
        }
    </script>
</body>
</html>
